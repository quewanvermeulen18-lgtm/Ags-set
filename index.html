<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insurance CRM</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2c; --border: #2a3244; --text: #e7ebf3;
    --muted: #93a0b8; --accent: #4f8cff; --danger: #ff5c5c; --good: #34c77b; --warn: #f5b942;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  a { color: var(--accent); }
  header.top { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; gap: 10px; }
  header.top .brand { font-weight: 700; font-size: 18px; }
  header.top nav button { background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; margin-left: 4px; padding: 6px 10px; border-radius: 6px; }
  header.top nav button:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  header.top nav button.active { color: var(--text); background: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 24px 0 10px; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat { text-align: center; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr.clickable { cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--border); }
  .badge.new { color: var(--accent); border-color: var(--accent); }
  .badge.contacted { color: var(--warn); border-color: var(--warn); }
  .badge.quoted { color: #b48bff; border-color: #b48bff; }
  .badge.sold { color: var(--good); border-color: var(--good); }
  .badge.lost { color: var(--danger); border-color: var(--danger); }
  .badge.source { color: var(--muted); border-color: var(--border); margin-left: 4px; }
  .badge.source.facebook { color: #1877f2; border-color: #1877f2; }
  .overdue { color: var(--danger); font-weight: 600; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    background: #0d1220; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%; font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  .field { margin-bottom: 12px; }
  .field.small { max-width: 200px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { opacity: 0.9; }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.danger { background: var(--danger); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .muted { color: var(--muted); }
  .mb-0 { margin-bottom: 0; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .hidden { display: none !important; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 10;
  }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-width: 640px; width: 100%; }
  @media (max-width: 800px) {
    .two-col { grid-template-columns: 1fr; }
    .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">📋 Insurance CRM</div>
  <nav>
    <button data-view="dashboard" class="navbtn active">Dashboard</button>
    <button data-view="leads" class="navbtn">Leads</button>
    <button id="newLeadBtn" class="navbtn">+ New Lead</button>
    <button id="exportBtn" class="navbtn">Export CSV</button>
  </nav>
</header>

<main>
  <div id="view-dashboard"></div>
  <div id="view-leads" class="hidden"></div>
</main>

<div id="modalRoot"></div>

<script>
/* ---------------- storage ---------------- */
const STORE_KEY = "insuranceCrm.leads";
const STATUSES = ["new", "contacted", "quoted", "sold", "lost"];
const POLICY_TYPES = ["auto", "home", "life", "health", "renters", "umbrella", "other"];
const SOURCES = ["referral", "website", "facebook ads", "google ads", "cold call", "walk-in", "other"];

function loadLeads() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function saveLeads(leads) {
  localStorage.setItem(STORE_KEY, JSON.stringify(leads));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function today() {
  return new Date().toISOString().slice(0, 10);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

let leads = loadLeads();
let currentView = "dashboard";
let filters = { status: "", policy_type: "", source: "", q: "" };

/* ---------------- nav ---------------- */
document.querySelectorAll(".navbtn[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});
document.getElementById("newLeadBtn").addEventListener("click", () => openLeadForm());
document.getElementById("exportBtn").addEventListener("click", exportCsv);

function setView(view) {
  currentView = view;
  document.querySelectorAll(".navbtn[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  document.getElementById("view-dashboard").classList.toggle("hidden", view !== "dashboard");
  document.getElementById("view-leads").classList.toggle("hidden", view !== "leads");
  render();
}

function render() {
  if (currentView === "dashboard") renderDashboard();
  if (currentView === "leads") renderLeads();
}

/* ---------------- dashboard ---------------- */
function renderDashboard() {
  const t = today();
  const active = leads.filter((l) => l.status !== "sold" && l.status !== "lost");
  const overdue = active.filter((l) => l.nextFollowUp && l.nextFollowUp < t).sort((a, b) => a.nextFollowUp.localeCompare(b.nextFollowUp));
  const dueToday = active.filter((l) => l.nextFollowUp === t).sort((a, b) => a.name.localeCompare(b.name));
  const counts = {};
  STATUSES.forEach((s) => (counts[s] = leads.filter((l) => l.status === s).length));

  const recentActivity = leads
    .flatMap((l) => (l.activities || []).map((a) => ({ ...a, leadName: l.name, leadId: l.id })))
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt))
    .slice(0, 10);

  document.getElementById("view-dashboard").innerHTML = `
    <h1>Dashboard</h1>
    <div class="grid cols-4">
      <div class="card stat"><div class="n">${counts.new || 0}</div><div class="label">New</div></div>
      <div class="card stat"><div class="n">${counts.contacted || 0}</div><div class="label">Contacted</div></div>
      <div class="card stat"><div class="n">${counts.quoted || 0}</div><div class="label">Quoted</div></div>
      <div class="card stat"><div class="n">${counts.sold || 0}</div><div class="label">Sold</div></div>
    </div>

    <h2>Overdue follow-ups (${overdue.length})</h2>
    <div class="card">
      ${overdue.length === 0 ? `<p class="muted">Nothing overdue. Nice.</p>` : `
        <table>
          <tr><th>Name</th><th>Status</th><th>Follow-up was due</th><th>Phone</th><th></th></tr>
          ${overdue.map((l) => `
            <tr>
              <td><a href="#" data-open="${l.id}">${esc(l.name)}</a></td>
              <td><span class="badge ${l.status}">${l.status}</span></td>
              <td class="overdue">${esc(l.nextFollowUp)}</td>
              <td>${esc(l.phone || "")}</td>
              <td><button class="btn secondary" data-open="${l.id}">Open</button></td>
            </tr>`).join("")}
        </table>`}
    </div>

    <h2>Due today (${dueToday.length})</h2>
    <div class="card">
      ${dueToday.length === 0 ? `<p class="muted">Nothing due today.</p>` : `
        <table>
          <tr><th>Name</th><th>Status</th><th>Phone</th><th></th></tr>
          ${dueToday.map((l) => `
            <tr>
              <td><a href="#" data-open="${l.id}">${esc(l.name)}</a></td>
              <td><span class="badge ${l.status}">${l.status}</span></td>
              <td>${esc(l.phone || "")}</td>
              <td><button class="btn secondary" data-open="${l.id}">Open</button></td>
            </tr>`).join("")}
        </table>`}
    </div>

    <h2>Recent activity</h2>
    <div class="card">
      ${recentActivity.length === 0 ? `<p class="muted">No activity logged yet.</p>` : `
        <table>
          <tr><th>When</th><th>Lead</th><th>Type</th><th>Notes</th></tr>
          ${recentActivity.map((a) => `
            <tr>
              <td class="muted">${esc(a.createdAt)}</td>
              <td><a href="#" data-open="${a.leadId}">${esc(a.leadName)}</a></td>
              <td>${esc(a.type)}</td>
              <td>${esc(a.notes || "")}</td>
            </tr>`).join("")}
        </table>`}
    </div>
  `;
  bindOpenButtons(document.getElementById("view-dashboard"));
}

/* ---------------- leads list ---------------- */
function filteredLeads() {
  return leads.filter((l) => {
    if (filters.status && l.status !== filters.status) return false;
    if (filters.policy_type && l.policyType !== filters.policy_type) return false;
    if (filters.source && l.source !== filters.source) return false;
    if (filters.q) {
      const q = filters.q.toLowerCase();
      const hay = `${l.name} ${l.email || ""} ${l.phone || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
}

function opts(list, selected) {
  return list.map((v) => `<option value="${v}" ${v === selected ? "selected" : ""}>${v}</option>`).join("");
}

function renderLeads() {
  const rows = filteredLeads();
  document.getElementById("view-leads").innerHTML = `
    <div class="toolbar">
      <h1 class="mb-0">Leads (${rows.length})</h1>
      <button class="btn" id="leadsNewBtn">+ New Lead</button>
    </div>

    <form class="inline card" style="margin-bottom:16px;" id="filterForm">
      <div class="field small">
        <label>Search</label>
        <input type="text" name="q" value="${esc(filters.q)}" placeholder="Name, phone, email" />
      </div>
      <div class="field small">
        <label>Status</label>
        <select name="status"><option value="">All</option>${opts(STATUSES, filters.status)}</select>
      </div>
      <div class="field small">
        <label>Policy type</label>
        <select name="policy_type"><option value="">All</option>${opts(POLICY_TYPES, filters.policy_type)}</select>
      </div>
      <div class="field small">
        <label>Source</label>
        <select name="source"><option value="">All</option>${opts(SOURCES, filters.source)}</select>
      </div>
      <div class="field small"><button class="btn secondary" type="submit">Filter</button></div>
    </form>

    <div class="card">
      <table>
        <tr><th>Name</th><th>Status</th><th>Policy</th><th>Source</th><th>Phone</th><th>Email</th><th>Next follow-up</th></tr>
        ${rows.map((l) => `
          <tr class="clickable" data-open="${l.id}">
            <td><a href="#" data-open="${l.id}">${esc(l.name)}</a></td>
            <td><span class="badge ${l.status}">${l.status}</span></td>
            <td>${esc(l.policyType || "")}</td>
            <td>${l.source ? `<span class="badge source ${l.source === "facebook ads" ? "facebook" : ""}">${esc(l.source)}</span>` : ""}</td>
            <td>${esc(l.phone || "")}</td>
            <td>${esc(l.email || "")}</td>
            <td>${esc(l.nextFollowUp || "")}</td>
          </tr>`).join("")}
      </table>
    </div>
  `;
  document.getElementById("leadsNewBtn").addEventListener("click", () => openLeadForm());
  document.getElementById("filterForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    filters = { status: fd.get("status") || "", policy_type: fd.get("policy_type") || "", source: fd.get("source") || "", q: fd.get("q") || "" };
    renderLeads();
  });
  bindOpenButtons(document.getElementById("view-leads"));
}

function bindOpenButtons(root) {
  root.querySelectorAll("[data-open]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      openLeadDetail(el.dataset.open);
    });
  });
}

/* ---------------- modal: new lead ---------------- */
function openLeadForm() {
  document.getElementById("modalRoot").innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2 class="mb-0">New Lead</h2>
        <form id="newLeadForm">
          <div class="two-col">
            <div class="field"><label>Name *</label><input type="text" name="name" required /></div>
            <div class="field"><label>Policy type</label><select name="policyType"><option value="">-- select --</option>${opts(POLICY_TYPES, "")}</select></div>
            <div class="field"><label>Phone</label><input type="text" name="phone" /></div>
            <div class="field"><label>Email</label><input type="email" name="email" /></div>
            <div class="field"><label>Source</label><select name="source"><option value="">-- select --</option>${opts(SOURCES, "")}</select></div>
            <div class="field"><label>Next follow-up</label><input type="date" name="nextFollowUp" /></div>
          </div>
          <div class="field"><label>Notes</label><textarea name="notes"></textarea></div>
          <div class="toolbar">
            <button type="button" class="btn secondary" id="cancelNew">Cancel</button>
            <button type="submit" class="btn">Save Lead</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById("cancelNew").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  document.getElementById("newLeadForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = (fd.get("name") || "").trim();
    if (!name) return;
    const now = new Date().toISOString();
    const lead = {
      id: uid(), name, phone: fd.get("phone") || "", email: fd.get("email") || "",
      policyType: fd.get("policyType") || "", status: "new", source: fd.get("source") || "",
      notes: fd.get("notes") || "", nextFollowUp: fd.get("nextFollowUp") || "",
      createdAt: now, updatedAt: now, activities: [], quotes: [],
    };
    leads.push(lead);
    saveLeads(leads);
    closeModal();
    openLeadDetail(lead.id);
  });
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

/* ---------------- modal: lead detail ---------------- */
function openLeadDetail(id) {
  const lead = leads.find((l) => l.id === id);
  if (!lead) return;

  document.getElementById("modalRoot").innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal" style="max-width:760px;">
        <div class="toolbar">
          <h2 class="mb-0">${esc(lead.name)}
            <span class="badge ${lead.status}">${lead.status}</span>
            ${lead.source ? `<span class="badge source ${lead.source === "facebook ads" ? "facebook" : ""}">${esc(lead.source)}</span>` : ""}
          </h2>
          <button class="btn secondary" id="closeDetail">Close</button>
        </div>

        <form id="editLeadForm">
          <div class="two-col">
            <div class="field"><label>Name</label><input type="text" name="name" value="${esc(lead.name)}" required /></div>
            <div class="field"><label>Status</label><select name="status">${opts(STATUSES, lead.status)}</select></div>
            <div class="field"><label>Policy type</label><select name="policyType"><option value="">-- select --</option>${opts(POLICY_TYPES, lead.policyType)}</select></div>
            <div class="field"><label>Source</label><select name="source"><option value="">-- select --</option>${opts(SOURCES, lead.source)}</select></div>
            <div class="field"><label>Phone</label><input type="text" name="phone" value="${esc(lead.phone)}" /></div>
            <div class="field"><label>Email</label><input type="email" name="email" value="${esc(lead.email)}" /></div>
            <div class="field"><label>Next follow-up</label><input type="date" name="nextFollowUp" value="${esc(lead.nextFollowUp)}" /></div>
          </div>
          <div class="field"><label>Notes</label><textarea name="notes">${esc(lead.notes)}</textarea></div>
          <div class="toolbar">
            <button type="button" class="btn danger" id="deleteLead">Delete Lead</button>
            <button type="submit" class="btn">Save Changes</button>
          </div>
        </form>

        <h2>Log follow-up</h2>
        <form id="activityForm" class="card">
          <div class="field small">
            <label>Type</label>
            <select name="type"><option value="call">Call</option><option value="email">Email</option><option value="text">Text</option><option value="meeting">Meeting</option><option value="note">Note</option></select>
          </div>
          <div class="field"><label>Notes</label><textarea name="notes" placeholder="What happened / what's next"></textarea></div>
          <button type="submit" class="btn">Log It</button>
        </form>

        <h2>Activity history</h2>
        <div class="card">
          ${(lead.activities || []).length === 0 ? `<p class="muted">No activity logged yet.</p>` : `
            <table>
              <tr><th>When</th><th>Type</th><th>Notes</th></tr>
              ${lead.activities.slice().reverse().map((a) => `
                <tr><td class="muted">${esc(a.createdAt)}</td><td>${esc(a.type)}</td><td>${esc(a.notes || "")}</td></tr>`).join("")}
            </table>`}
        </div>

        <h2>Quotes / policy comparison</h2>
        <form id="quoteForm" class="card inline" style="margin-bottom:16px;">
          <div class="field small"><label>Carrier *</label><input type="text" name="carrier" required /></div>
          <div class="field small"><label>Policy type</label><select name="policyType"><option value="">-- select --</option>${opts(POLICY_TYPES, "")}</select></div>
          <div class="field small"><label>Premium/mo ($)</label><input type="number" step="0.01" name="premium" /></div>
          <div class="field small"><label>Deductible ($)</label><input type="number" step="0.01" name="deductible" /></div>
          <div class="field small"><label>Coverage</label><input type="text" name="coverageLimit" placeholder="100/300/100" /></div>
          <div class="field small"><button type="submit" class="btn">Add Quote</button></div>
        </form>
        <div class="card">
          ${(lead.quotes || []).length === 0 ? `<p class="muted">No quotes yet.</p>` : `
            <table>
              <tr><th>Carrier</th><th>Policy</th><th>Premium/mo</th><th>Deductible</th><th>Coverage</th><th></th></tr>
              ${lead.quotes.map((q) => `
                <tr>
                  <td>${esc(q.carrier)}</td><td>${esc(q.policyType || "")}</td>
                  <td>${q.premium != null ? "$" + Number(q.premium).toFixed(2) : ""}</td>
                  <td>${q.deductible != null ? "$" + Number(q.deductible).toFixed(2) : ""}</td>
                  <td>${esc(q.coverageLimit || "")}</td>
                  <td><button class="btn secondary" data-remove-quote="${q.id}">Remove</button></td>
                </tr>`).join("")}
            </table>`}
        </div>
      </div>
    </div>
  `;

  document.getElementById("closeDetail").addEventListener("click", closeModal);
  document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });

  document.getElementById("editLeadForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    Object.assign(lead, {
      name: fd.get("name").trim(), status: fd.get("status"), policyType: fd.get("policyType") || "",
      source: fd.get("source") || "", phone: fd.get("phone") || "", email: fd.get("email") || "",
      nextFollowUp: fd.get("nextFollowUp") || "", notes: fd.get("notes") || "", updatedAt: new Date().toISOString(),
    });
    saveLeads(leads);
    render();
    openLeadDetail(lead.id);
  });

  document.getElementById("deleteLead").addEventListener("click", () => {
    if (!confirm("Delete this lead permanently?")) return;
    leads = leads.filter((l) => l.id !== lead.id);
    saveLeads(leads);
    closeModal();
    render();
  });

  document.getElementById("activityForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    lead.activities = lead.activities || [];
    lead.activities.push({ id: uid(), type: fd.get("type"), notes: fd.get("notes") || "", createdAt: new Date().toISOString() });
    lead.updatedAt = new Date().toISOString();
    saveLeads(leads);
    openLeadDetail(lead.id);
  });

  document.getElementById("quoteForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const carrier = (fd.get("carrier") || "").trim();
    if (!carrier) return;
    lead.quotes = lead.quotes || [];
    lead.quotes.push({
      id: uid(), carrier, policyType: fd.get("policyType") || "",
      premium: fd.get("premium") ? Number(fd.get("premium")) : null,
      deductible: fd.get("deductible") ? Number(fd.get("deductible")) : null,
      coverageLimit: fd.get("coverageLimit") || "",
    });
    lead.updatedAt = new Date().toISOString();
    saveLeads(leads);
    openLeadDetail(lead.id);
  });

  document.getElementById("modalRoot").querySelectorAll("[data-remove-quote]").forEach((btn) => {
    btn.addEventListener("click", () => {
      lead.quotes = (lead.quotes || []).filter((q) => q.id !== btn.dataset.removeQuote);
      saveLeads(leads);
      openLeadDetail(lead.id);
    });
  });
}

/* ---------------- export ---------------- */
function exportCsv() {
  const header = ["id", "name", "phone", "email", "policyType", "status", "source", "notes", "nextFollowUp", "createdAt"];
  const escCsv = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [header.join(",")].concat(leads.map((l) => header.map((h) => escCsv(l[h])).join(","))).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `leads-export-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
