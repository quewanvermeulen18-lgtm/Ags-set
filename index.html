<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client CRM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scrim"></div>
<aside id="sidebar"></aside>

<div class="appmain">
  <header class="topbar">
    <button id="hamburger" class="iconbtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 id="pageTitle">Dashboard</h1>
    <div class="tb-globalsearch"><input type="text" id="globalSearch" placeholder="Search clients…"></div>
    <button id="themeToggleMobile" class="iconbtn" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main id="pageRoot"></main>
</div>

<nav id="bottomnav"></nav>

<div id="sheetRoot"></div>
<div id="dialogRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
